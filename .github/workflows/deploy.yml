name: Deploy WeizVPN Backend to Server

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: |
          cd backend
          npm ci
          echo "✅ Dependencies installed"

      - name: 🔍 Debug SSH Connection
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            echo "✅ SSH connection successful"
            echo "Hostname: $(hostname)"
            echo "User: $(whoami)"
            echo "Docker: $(docker --version 2>/dev/null || echo 'not installed')"
            echo "Docker Compose: $(docker-compose --version 2>/dev/null || echo 'not installed')"

      - name: 🔄 Server Setup (Docker, Nginx, Directory)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            # Install Docker if not installed
            if ! command -v docker &> /dev/null; then
              echo "📦 Installing Docker..."
              curl -fsSL https://get.docker.com | bash
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            # Install Docker Compose v2 plugin if not installed
            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              echo "📦 Installing Docker Compose..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            fi

            # Create target directory
            sudo mkdir -p /var/www/weizvpn
            sudo chown -R $USER:$USER /var/www/weizvpn
            echo "✅ Server setup complete"

      - name: 🚀 Deploy Backend Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          source: "backend/*,backend/**/*,docker-compose.yml"
          target: "/var/www/weizvpn"
          strip_components: 0
          rm: false

      - name: 🔄 Build & Restart Docker Containers
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script: |
            cd /var/www/weizvpn

            # Create .env file from GitHub secret if provided
            if [ -n "${{ secrets.JWT_SECRET }}" ]; then
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > backend/.env
              echo "NODE_ENV=production" >> backend/.env
              echo "PORT=3000" >> backend/.env
            fi

            # Pull latest images and rebuild
            echo "🐳 Building and restarting Docker containers..."
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d

            # Clean up old images
            docker image prune -f

            # Check container status
            echo "📊 Container Status:"
            docker-compose ps

            echo "✅ Deployment completed successfully!"
